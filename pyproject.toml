[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["monitor/substreams_pb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
exclude = ["monitor/substreams_pb"]

[tool.ty.environment]
python-version = "3.10"
extra-paths = ["monitor/substreams_pb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
